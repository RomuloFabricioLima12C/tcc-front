<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="login.css">

    <title>Login | lightlab.</title>
</head>

<body>

    <main class="PAG-DE-LOGIN">

        <button
            class="plano-de-negcios"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Alternar tema">

            <img src="https://c.animaapp.com/mrp1212w8ZbBMm/img/plano-de-neg-cios--4--1.png" alt="">
        </button>

        <div class="rectangle" aria-hidden="true"></div>

        <img class="img" src="https://c.animaapp.com/mrp1212w8ZbBMm/img/plano-de-neg-cios--19--2.png" alt="" aria-hidden="true">
        <img class="plano-de-negcios-2" src="https://c.animaapp.com/mrp1212w8ZbBMm/img/plano-de-neg-cios-5.png" alt="" aria-hidden="true">
        <img class="plano-de-negcios-3" src="https://c.animaapp.com/mrp1212w8ZbBMm/img/plano-de-neg-cios--27--1.png" alt="" aria-hidden="true">
        <img class="plano-de-negcios-4" src="https://c.animaapp.com/mrp1212w8ZbBMm/img/plano-de-neg-cios--19--3.png" alt="" aria-hidden="true">

        <section aria-labelledby="login-title">

            <h1 class="text-wrapper" id="login-title">
                Bom te ver de novo,
            </h1>

            <p class="insira-suas-informa">
                Insira suas informações a seguir
            </p>

            <form method="post">

                <label class="text-wrapper-2" for="email">
                    E-mail
                </label>

                <input
                    class="card"
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email">
            
                

                <label class="text-wrapper-4" for="senha">
                    Senha
                </label>

                <input
                    class="card-2"
                    id="senha"
                    name="senha"
                    type="password"
                    autocomplete="current-password"
                    required
                    aria-required="true">

                <button class="div-wrapper" type="submit">
                    <span class="text-wrapper-3">ENTRAR</span>
                </button>

            </form>

            <p class="text-wrapper-5">
                Não tem uma conta?
                <a class="div" href="#cadastro">Cadastrar-se</a>
            </p>

        </section>

        <img class="plano-de-negcios-5" src="https://c.animaapp.com/mrp1212w8ZbBMm/img/plano-de-neg-cios-2.png" alt="lightlab.">

        <footer class="group">

            <div class="rectangle-2" aria-hidden="true"></div>

            <div class="group-2">

                <img class="LOGO" src="https://c.animaapp.com/mrp1212w8ZbBMm/img/logo.png" alt="lightlab.">

                <nav aria-label="Navegação do rodapé">

                    <section aria-labelledby="footer-inicio">
                        <h2 class="text-wrapper-6" id="footer-inicio">início</h2>
                        <a class="text-wrapper-7" href="#inicio">Home</a>
                        <a class="text-wrapper-8" href="#componentes">Componentes</a>
                    </section>

                    <section aria-labelledby="footer-sobre">
                        <h2 class="text-wrapper-9" id="footer-sobre">Sobre Nós</h2>
                        <a class="text-wrapper-10" href="#quem-somos">Quem somos?</a>
                        <a class="text-wrapper-11" href="#nosso-projeto">Nosso projeto</a>
                    </section>

                    <section aria-labelledby="footer-suporte">
                        <h2 class="text-wrapper-12" id="footer-suporte">Suporte</h2>
                        <a class="text-wrapper-13" href="#contatos">Contatos</a>
                        <a class="text-wrapper-14" href="#faq">FAQ</a>
                    </section>

                </nav>

                <img class="vector" src="https://c.animaapp.com/mrp1212w8ZbBMm/img/vector.svg" alt="" aria-hidden="true">

            </div>

        </footer>

        <img class="plano-de-negcios-6" src="https://c.animaapp.com/mrp1212w8ZbBMm/img/plano-de-neg-cios-4.png" alt="" aria-hidden="true">

    </main>

  <script src="responsive.js"></script>

</body>

</html>
